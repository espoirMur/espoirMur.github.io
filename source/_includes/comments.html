{% if page.comments %}
{%- if page.id -%}
<br>
Comments
<br>
<!--Every article has a id, but special pages don't unless you set manually.
This prevents Cusdis from appear everywhere-->
<div id="cusdis_thread"
  data-host="https://cusdis.com"
  data-app-id="49460c1b-dcbb-4633-8c78-63d7b5100f73"
  data-page-id="{{ page.id }}"
  data-page-url="{{ site.url }}{{ page.baseurl }}{{ page.url }}"
  data-page-title="{{ page.title }}"
  data-theme="light"
></div>
<script defer src="https://cusdis.com/js/cusdis.es.js"></script>
<script>
  // Sync Cusdis theme with site theme
  document.addEventListener('DOMContentLoaded', function() {
    const cusdis = document.getElementById('cusdis_thread');
    if (cusdis) {
      const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      cusdis.setAttribute('data-theme', theme);
    }
  });
</script>
{%- endif -%}
{% endif %}
